name: TTYBuild
options:
  bundleIdPrefix: air.build
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true

packages:
  TTYBuildKit:
    path: ../shared/TTYBuildKit
  GhosttyKit:
    url: https://github.com/Lakr233/libghostty-spm
    from: 1.3.0

targets:
  TTYBuild:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources
      - Resources
      - SharedStatus
    dependencies:
      - package: TTYBuildKit
        product: TTYBuildKit
      - package: GhosttyKit
        product: GhosttyTerminal
      - package: GhosttyKit
        product: GhosttyTheme
      - target: TTYBuildWidgets
      - target: TTYBuildWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: air.build.pedals
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "26"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QDJ93ZUQ9B
        APS_ENVIRONMENT: development
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Pedals YellowPlus App Store
    entitlements:
      path: Entitlements/TTYBuild.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.air.build.pedals
        # App-id group FIRST so it stays the default write group; the shared
        # group carries only derived Live Activity content keys.
        keychain-access-groups:
          - $(AppIdentifierPrefix)air.build.pedals
          - $(AppIdentifierPrefix)air.build.pedals.shared
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TTY.Build
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - TTYBuildStatusTests

  TTYBuildStatusTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests
    dependencies:
      - target: TTYBuild
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: air.build.pedals.tests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QDJ93ZUQ9B

  TTYBuildWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Widgets
      - Resources/AgentMarks.xcassets
      - path: SharedStatus
        excludes:
          - IOSWatchConnectivityBridge.swift
          - TTYLiveActivityController.swift
          - WatchTerminalContext.swift
    dependencies:
      - package: TTYBuildKit
        product: TTYBuildKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: air.build.pedals.widgets
        PRODUCT_NAME: TTYBuildWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "26"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QDJ93ZUQ9B
        APS_ENVIRONMENT: development
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Pedals Widgets YellowPlus App Store
    entitlements:
      path: Entitlements/TTYBuildWidgets.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.air.build.pedals
        keychain-access-groups:
          - $(AppIdentifierPrefix)air.build.pedals.shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TTY.Build Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  TTYBuildWatch:
    # Xcode 14+ single-target SwiftUI watch app: code lives directly in an
    # application target (there is no legacy WatchKit extension target).
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - WatchApp
      # Agent brand marks (shared catalog; the app-icon catalog stays
      # target-specific).
      - Resources/AgentMarks.xcassets
      - path: SharedStatus
        excludes:
          - AgentActivityKeyStore.swift
          - IOSWatchConnectivityBridge.swift
          - TTYActivityAttributes.swift
          - TTYLiveActivityController.swift
    dependencies:
      - package: TTYBuildKit
        product: TTYBuildKit
      - target: TTYBuildWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: air.build.pedals.watchapp
        PRODUCT_NAME: TTYBuildWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "26"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QDJ93ZUQ9B
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Pedals Watch YellowPlus App Store
    entitlements:
      path: Entitlements/TTYBuildWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.air.build.pedals
    info:
      path: WatchApp/Info.plist
      properties:
        CFBundleDisplayName: TTY.Build
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: air.build.pedals

  TTYBuildWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - WatchWidgets
      - path: SharedStatus
        excludes:
          - AgentActivityKeyStore.swift
          - IOSWatchConnectivityBridge.swift
          - TTYActivityAttributes.swift
          - TTYLiveActivityController.swift
          - WatchTerminalContext.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: air.build.pedals.watchapp.widgets
        PRODUCT_NAME: TTYBuildWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "6.0"
        CURRENT_PROJECT_VERSION: "26"
        MARKETING_VERSION: "1.2.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QDJ93ZUQ9B
        APS_ENVIRONMENT: development
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Pedals Watch Widgets YellowPlus App Store
    entitlements:
      path: Entitlements/TTYBuildWatchWidgets.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.air.build.pedals
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: TTY.Build Watch Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
